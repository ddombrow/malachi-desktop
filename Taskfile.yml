version: '3'

vars:
  APP_NAME: "malachi-desktop"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # Linux: build against GTK3 + webkit2gtk-4.1 (Wails 3 defaults to GTK4 +
  # webkitgtk-6.0). Set EXTRA_TAGS=nogtk3 to use the GTK4 backend instead.
  EXTRA_TAGS: '{{.EXTRA_TAGS | default "gtk3"}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  install:desktop:
    summary: "Linux: installs the app to ~/.local/bin with its .desktop file and icons, so launchers and Wayland docks show its icon"
    platforms: [linux]
    deps: [build]
    vars:
      ID: io.github.ddombrow.malachi-desktop
      DATA: '{{.XDG_DATA_HOME | default (print .HOME "/.local/share")}}'
    cmds:
      - install -Dm755 {{.BIN_DIR}}/{{.APP_NAME}} "{{.HOME}}/.local/bin/{{.APP_NAME}}"
      - install -Dm644 build/linux/{{.ID}}.desktop "{{.DATA}}/applications/{{.ID}}.desktop"
      - install -Dm644 build/appicon.svg "{{.DATA}}/icons/hicolor/scalable/apps/{{.ID}}.svg"
      - install -Dm644 build/linux/icons/512x512.png "{{.DATA}}/icons/hicolor/512x512/apps/{{.ID}}.png"
      - install -Dm644 build/linux/icons/256x256.png "{{.DATA}}/icons/hicolor/256x256/apps/{{.ID}}.png"
      - rm -f "{{.DATA}}/icons/hicolor/1024x1024/apps/{{.ID}}.png"  # not a hicolor size; earlier installs put one here
      - update-desktop-database "{{.DATA}}/applications" 2>/dev/null || true
      - gtk-update-icon-cache -f -t "{{.DATA}}/icons/hicolor" 2>/dev/null || true
      - kbuildsycoca6 2>/dev/null || kbuildsycoca5 2>/dev/null || true

  uninstall:desktop:
    summary: "Linux: removes what install:desktop installed"
    platforms: [linux]
    vars:
      ID: io.github.ddombrow.malachi-desktop
      DATA: '{{.XDG_DATA_HOME | default (print .HOME "/.local/share")}}'
    cmds:
      - rm -f "{{.HOME}}/.local/bin/{{.APP_NAME}}" "{{.DATA}}/applications/{{.ID}}.desktop"
      - rm -f "{{.DATA}}/icons/hicolor/scalable/apps/{{.ID}}.svg" "{{.DATA}}/icons/hicolor/512x512/apps/{{.ID}}.png" "{{.DATA}}/icons/hicolor/256x256/apps/{{.ID}}.png" "{{.DATA}}/icons/hicolor/1024x1024/apps/{{.ID}}.png"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
